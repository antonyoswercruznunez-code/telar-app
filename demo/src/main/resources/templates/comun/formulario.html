<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title th:text="${e.singular()} + ' | Telar MX'">Telar MX</title>
    <link rel="stylesheet" th:href="@{/css/gestion.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo-telar-mx.svg}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/menu :: menu(${activo})}"></aside>
    <main class="content content-narrow">
        <header class="page-header">
            <div><p class="eyebrow" th:text="${e.modulo()}">Módulo</p>
                <h1 th:text="${id == null ? 'Nuevo: ' : 'Editar: '} + ${e.singular()}">Formulario</h1></div>
            <a class="button button-secondary" th:href="@{${'/gestion/' + e.clave() + qs}}">Volver</a>
        </header>
        <div class="notice error" th:if="${!#lists.isEmpty(errores)}">
            <strong>Revisa lo siguiente:</strong>
            <ul><li th:each="er : ${errores}" th:text="${er}">Error</li></ul>
        </div>
        <form class="form-panel" method="post"
              th:action="@{${id == null ? '/gestion/' + e.clave() : '/gestion/' + e.clave() + '/' + id + '/editar'}}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input th:each="ff : ${filtros}" type="hidden" th:name="'f_' + ${ff.key}" th:value="${ff.value}">
            <section class="form-section">
                <div class="form-grid">
                    <th:block th:each="c : ${e.campos()}">
                        <label class="field" th:if="${c.enFormulario()}"
                               th:classappend="${c.ancho()} ? 'field-wide'">
                            <span th:text="${c.etiqueta()} + (${c.requerido()} ? ' *' : '')">Campo</span>
                            <th:block th:switch="${c.tipo().name()}">
                                <textarea class="input textarea" rows="3" th:case="'AREA'" th:name="${c.nombre()}"
                                          th:text="${valores[c.nombre()]}"></textarea>
                                <input class="input" maxlength="255" th:case="'TEXTO'" th:name="${c.nombre()}"
                                       th:required="${c.requerido()}" th:value="${valores[c.nombre()]}" type="text">
                                <input class="input" min="0" step="1" th:case="'ENTERO'" th:name="${c.nombre()}"
                                       th:required="${c.requerido()}" th:value="${valores[c.nombre()]}" type="number">
                                <input class="input" min="0" step="0.01" th:case="'DECIMAL'" th:name="${c.nombre()}"
                                       th:required="${c.requerido()}" th:value="${valores[c.nombre()]}" type="number">
                                <input class="input" th:case="'FECHA'" th:name="${c.nombre()}"
                                       th:required="${c.requerido()}" th:value="${valores[c.nombre()]}" type="date">
                                <input class="input" th:case="'FECHAHORA'" th:name="${c.nombre()}"
                                       th:required="${c.requerido()}" th:value="${valores[c.nombre()]}" type="datetime-local">
                                <select class="input" th:case="'LISTA'" th:name="${c.nombre()}" th:required="${c.requerido()}">
                                    <option value="" th:if="${!c.requerido()}">— Ninguno —</option>
                                    <option th:each="o : ${c.opciones()}" th:value="${o}" th:text="${o}"
                                            th:selected="${o == valores[c.nombre()]}">Opción</option>
                                </select>
                                <select class="input" th:case="'FK'" th:name="${c.nombre()}" th:required="${c.requerido()}">
                                    <option value="">— Selecciona —</option>
                                    <option th:each="o : ${opciones[c.nombre()]}" th:value="${o.id()}" th:text="${o.etiqueta()}"
                                            th:selected="${o.id() == valores[c.nombre()]}">Opción</option>
                                </select>
                            </th:block>
                        </label>
                    </th:block>
                </div>
            </section>
            <div class="form-actions">
                <a class="button button-secondary" th:href="@{${'/gestion/' + e.clave() + qs}}">Cancelar</a>
                <button class="button button-primary" type="submit">Guardar</button>
            </div>
        </form>
    </main>
</div>
</body>
</html>
