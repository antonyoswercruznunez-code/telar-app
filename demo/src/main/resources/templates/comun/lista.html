<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title th:text="${e.titulo()} + ' | Telar MX'">Telar MX</title>
    <link rel="stylesheet" th:href="@{/css/gestion.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo-telar-mx.svg}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/menu :: menu(${activo})}"></aside>
    <main class="content">
        <header class="page-header">
            <div><p class="eyebrow" th:text="${e.modulo()}">Módulo</p>
                <h1 th:text="${e.titulo()}">Título</h1></div>
            <a class="button button-primary" th:href="@{${'/gestion/' + e.clave() + '/nuevo' + qs}}"
               th:text="'＋ Nuevo: ' + ${e.singular()}">＋ Nuevo</a>
        </header>
        <div class="notice success" th:if="${mensaje}" th:text="${mensaje}"></div>
        <div class="notice error" th:if="${error}" th:text="${error}"></div>
        <div class="notice success" th:if="${!#lists.isEmpty(filtrosVista)}">
            Filtrado por: <strong th:text="${#strings.listJoin(filtrosVista, ' · ')}">filtro</strong> ·
            <a class="text-link" th:href="@{${'/gestion/' + e.clave()}}">Quitar filtro</a>
        </div>
        <section class="panel">
            <form class="panel-toolbar" method="get" th:action="@{${'/gestion/' + e.clave()}}">
                <h2 th:text="${e.titulo()}">Registros</h2>
                <div class="toolbar-actions">
                    <input th:each="ff : ${filtros}" type="hidden" th:name="'f_' + ${ff.key}" th:value="${ff.value}">
                    <input class="input search-input" name="q" placeholder="Buscar…" th:value="${q}" type="search">
                    <button class="button button-secondary" type="submit">Buscar</button>
                </div>
            </form>
            <div class="table-scroll" th:if="${!#lists.isEmpty(filas)}">
                <table>
                    <thead>
                    <tr>
                        <th>N.º</th>
                        <th:block th:each="c : ${e.campos()}"><th th:if="${c.enLista()}" th:text="${c.etiqueta()}">Campo</th></th:block>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="f : ${filas}">
                        <td th:text="'#' + ${f['__id']}">#1</td>
                        <th:block th:each="c : ${e.campos()}"><td th:if="${c.enLista()}" th:text="${f[c.nombre()]}">—</td></th:block>
                        <td>
                            <div class="actions">
                                <a class="text-link" th:each="h : ${e.hijos()}"
                                   th:href="@{${'/gestion/' + h.clave() + '?f_' + h.columna() + '=' + f['__id']}}"
                                   th:text="${h.etiqueta()}">Detalle</a>
                                <a class="text-link" th:href="@{${'/gestion/' + e.clave() + '/' + f['__id'] + '/editar' + qs}}">Editar</a>
                                <form method="post" th:action="@{${'/gestion/' + e.clave() + '/' + f['__id'] + '/eliminar'}}"
                                      th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
                                      onsubmit="return confirm('¿Eliminar este registro?')">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <input th:each="ff : ${filtros}" type="hidden" th:name="'f_' + ${ff.key}" th:value="${ff.value}">
                                    <button class="link-danger" type="submit">Eliminar</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="empty-state" th:if="${#lists.isEmpty(filas)}"><strong>No hay registros para mostrar</strong>
                <span>Crea el primero con el botón «Nuevo».</span></div>
            <footer class="panel-foot" th:text="${#lists.size(filas)} + ' registros (máximo 500 más recientes)'">0 registros</footer>
        </section>
    </main>
</div>
</body>
</html>
