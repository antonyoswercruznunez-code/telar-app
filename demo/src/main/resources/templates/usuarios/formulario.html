<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear usuario | Telar MX</title>
    <link rel="stylesheet" th:href="@{/css/gestion.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo-telar-mx.svg}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/menu :: menu('/usuarios/nuevo')}"></aside>
    <main class="content content-narrow">
        <header class="page-header">
            <div>
                <p class="eyebrow">Accesos</p>
                <h1>Crear usuario</h1>
                <p class="subtitle">Registra una cuenta para acceder al sistema.</p>
            </div>
        </header>
        <div class="notice success" th:if="${mensaje}" th:text="${mensaje}"></div>
        <div class="notice error" th:if="${!#lists.isEmpty(errores)}">
            <strong>Revisa estos datos:</strong>
            <ul><li th:each="error : ${errores}" th:text="${error}">Error</li></ul>
        </div>
        <form class="form-panel" method="post" th:action="@{/usuarios}" th:object="${usuario}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <section class="form-section">
                <h2>Datos de acceso</h2>
                <div class="form-grid">
                    <label class="field field-wide">Nombre *
                        <input class="input" type="text" maxlength="100" th:field="*{nombre}" required>
                    </label>
                    <label class="field field-wide">Correo electrónico *
                        <input class="input" type="email" maxlength="100" th:field="*{correo}" required>
                    </label>
                    <label class="field">Contraseña * <span class="field-hint">Mínimo 8 caracteres</span>
                        <input class="input" type="password" maxlength="72" th:field="*{clave}" minlength="8" autocomplete="new-password" required>
                    </label>
                    <label class="field">Confirmar contraseña *
                        <input class="input" type="password" maxlength="72" th:field="*{confirmarClave}" minlength="8" autocomplete="new-password" required>
                    </label>
                    <label class="field">Rol *
                        <select class="input" th:field="*{rol}">
                            <option th:each="r : ${roles}" th:value="${r.name()}" th:text="${r.etiqueta}">Rol</option>
                        </select>
                    </label>
                </div>
            </section>
            <div class="form-actions">
                <button class="button button-primary" type="submit">Crear usuario</button>
            </div>
        </form>
    </main>
</div>
</body>
</html>
