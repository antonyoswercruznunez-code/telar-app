<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Telar MX</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<main class="auth-layout">
  <section class="auth-card">
    <a class="brand" th:href="@{/login}"><img alt="Telar MX" class="brand-logo" th:src="@{/img/logo-telar-mx.svg}"><span>TELAR <span class="brand-light">MX</span></span></a>
    <p class="eyebrow">Sistema de gestión</p>
    <h1>Bienvenido</h1>
    <p class="subtitle">Inicia sesión para continuar.</p>
    <div class="notice success" th:if="${param.logout}">Sesión cerrada correctamente.</div>
    <div class="notice error" th:if="${param.error}">Correo o contraseña incorrectos.</div>
    <form class="auth-form" method="post" th:action="@{/login}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <label class="field">Correo electrónico<input class="input" type="email" name="username" autocomplete="username" required autofocus></label>
      <label class="field">Contraseña<input class="input" type="password" name="password" autocomplete="current-password" required></label>
      <button class="submit-button" type="submit">Iniciar sesión</button>
    </form>
    <p class="footnote">Telar MX</p>
  </section>
</main>
</body>
</html>
