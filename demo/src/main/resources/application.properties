# La conexión se toma de variables de entorno; los valores por defecto sirven para XAMPP local.
# Ejemplo en Windows (PowerShell):  $env:DB_PASSWORD="tu_clave"
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/telar_mx}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# El esquema lo define db/telar_mx.sql; Hibernate no debe modificarlo.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false